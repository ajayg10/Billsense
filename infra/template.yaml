AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: BillSense backend - stateless FastAPI Lambda and HTTP API; frontend hosted separately by Amplify
Parameters:
  AllowedOrigins:
    Type: String
    Default: https://example.invalid
    Description: Comma-separated exact browser origins for optional direct API access. Not required by the same-origin Amplify proxy.
  AIEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  BedrockModelId:
    Type: String
    Default: ''
    Description: Model identifier supported in this region. Required only if AI is enabled.
  BedrockModelArn:
    Type: String
    Default: ''
    Description: Exact regional foundation model ARN allowed for invocation. Required for AI.
Conditions:
  EnableAI: !Equals [!Ref AIEnabled, 'true']
Resources:
  BillingAPI:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2
  BillingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/
      Handler: app.main.handler
      Runtime: python3.11
      Architectures: [x86_64]
      MemorySize: 512
      Timeout: 28
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          AI_ENABLED: !Ref AIEnabled
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - AWSLambdaBasicExecutionRole
        - !If
          - EnableAI
          - Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref BedrockModelArn
          - !Ref AWS::NoValue
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref BillingAPI
            Path: /api/{proxy+}
            Method: ANY
  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${BillingFunction}'
      RetentionInDays: 7
Outputs:
  ApiUrl:
    Description: API origin. Keep the /api prefix in the Amplify reverse-proxy target.
    Value: !Sub 'https://${BillingAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  HealthUrl:
    Value: !Sub 'https://${BillingAPI}.execute-api.${AWS::Region}.${AWS::URLSuffix}/api/v1/health'
  FunctionName:
    Value: !Ref BillingFunction
